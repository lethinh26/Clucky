server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    hikari:
      schema: identity_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity_service
  flyway:
    default-schema: identity_service
    schemas: identity_service
    create-schemas: true
    baseline-on-migrate: false
  kafka:
    producer:
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:clucky}

clucky:
  auth:
    bridge:
      base-url: ${BRIDGE_BASE_URL:https://api.bridge.kroszborg.co}
      api-key: ${BRIDGE_API_KEY:}
    google:
      enabled: ${FIREBASE_AUTH_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:}
    access-ttl: ${AUTH_ACCESS_TTL:30m}
    refresh-ttl: ${AUTH_REFRESH_TTL:7d}
    otp-ttl: ${AUTH_OTP_TTL:5m}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:${FRONTEND_CUSTOMER_URL:http://localhost:3000},${FRONTEND_ADMIN_URL:http://localhost:3001},http://localhost:5173}
