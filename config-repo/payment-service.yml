server:
  port: ${SERVER_PORT:8084}
payment:
  sepay:
    api-key: ${SEPAY_API_KEY:}
  local-simulation:
    enabled: ${PAYMENT_LOCAL_SIMULATION_ENABLED:false}
spring:
  application:
    name: payment-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    hikari:
      schema: payment_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_service
  flyway:
    default-schema: payment_service
    schemas: payment_service
    create-schemas: true
    baseline-on-migrate: false`r`n    out-of-order: true

