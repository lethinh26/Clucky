server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: cart-order-service
  datasource:
    hikari:
      schema: order_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_service
  flyway:
    default-schema: order_service
    schemas: order_service
    create-schemas: true
    baseline-on-migrate: false
  session:
    timeout: 24h
    redis:
      namespace: clucky:cart:sessions
clucky:
  identity:
    issuer: ${IDENTITY_ISSUER_URI:}
