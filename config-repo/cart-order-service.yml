server:
  port: ${SERVER_PORT:8083}
payment:
  session-ttl: 15m
spring:
  application:
    name: cart-order-service
  datasource:
    hikari:
      schema: order_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_service
  flyway:
    default-schema: order_service
    schemas: order_service
    create-schemas: true
    baseline-on-migrate: false
  session:
    timeout: 24h
    redis:
      namespace: clucky:cart:sessions

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:clucky}

clucky:
  loyalty:
    internal-token: ${LOYALTY_INTERNAL_TOKEN:}
  identity:
    issuer: ${IDENTITY_ISSUER_URI:}
  catalog:
    service-token: ${CATALOG_SERVICE_TOKEN:}
    service-url: ${CATALOG_SERVICE_URL:http://catalog-store-service}
  shipping:
    service-url: ${SHIPPING_SERVICE_URL:http://shipping-service}
  promotion:
    service-token: ${PROMOTION_SERVICE_TOKEN:}
    service-url: ${PROMOTION_SERVICE_URL:http://promotion-loyalty-service}
