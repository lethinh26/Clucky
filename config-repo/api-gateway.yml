clucky:
  auth:
    customer-origins: ${AUTH_CUSTOMER_ORIGINS:${FRONTEND_CUSTOMER_URL:http://localhost:3000}}
    admin-origins: ${AUTH_ADMIN_ORIGINS:${FRONTEND_ADMIN_URL:http://localhost:3001},http://localhost:5173}
server:
  port: ${SERVER_PORT:8080}
spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: identity
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/schedules/**
        - id: catalog
          uri: lb://CATALOG-STORE-SERVICE
          predicates:
            - Path=/api/stores/**,/api/catalog/**,/api/media/**,/api/locations/**
        - id: orders
          uri: lb://CART-ORDER-SERVICE
          predicates:
            - Path=/api/cart/**,/api/orders/**,/api/refund-requests/**
        - id: payments
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: promotions
          uri: lb://PROMOTION-LOYALTY-SERVICE
          predicates:
            - Path=/api/promotions/**,/api/loyalty/**
        - id: shipping
          uri: lb://SHIPPING-SERVICE
          predicates:
            - Path=/api/shipping/**
        - id: notifications
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
        - id: reports
          uri: lb://REVIEW-REPORT-SERVICE
          predicates:
            - Path=/api/reviews/**,/api/reports/**
        - id: audit
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit-logs,/api/audit-logs/export
