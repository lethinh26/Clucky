server:
  port: ${SERVER_PORT:8087}
spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: notification-service
  datasource:
    hikari:
      schema: notification_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_service
  flyway:
    default-schema: notification_service
    schemas: notification_service
    create-schemas: true
    baseline-on-migrate: false

clucky:
  kafka:
    security-email-topic: identity.branch-email
    email-request-topic: email.requested
    email-consumer-group: clucky-branch-mail-v1
  frontend:
    customer-url: ${FRONTEND_CUSTOMER_URL:http://localhost:3000}
    admin-url: ${FRONTEND_ADMIN_URL:http://localhost:3001}

mail-sender:
  enabled: ${MAIL_SENDER_ENABLED:false}
  host: ${MAIL_SENDER_HOST:smtp.gmail.com}
  port: ${MAIL_SENDER_PORT:587}
  username: ${MAIL_SENDER_USERNAME:}
  app-password: ${MAIL_SENDER_APP_PASSWORD:}
  from-name: ${MAIL_SENDER_FROM_NAME:Clucky}
  timeout-ms: ${MAIL_SENDER_TIMEOUT_MS:8000}
  max-retries: ${MAIL_SENDER_MAX_RETRIES:3}
  poll-interval-ms: ${MAIL_SENDER_POLL_INTERVAL_MS:1000}
  lease-seconds: ${MAIL_SENDER_LEASE_SECONDS:300}
  retention-hours: ${MAIL_SENDER_RETENTION_HOURS:168}
  max-manual-retries: ${MAIL_SENDER_MAX_MANUAL_RETRIES:2}
  retry-base-seconds: ${MAIL_SENDER_RETRY_BASE_SECONDS:5}
  retry-max-seconds: ${MAIL_SENDER_RETRY_MAX_SECONDS:300}
  failure-topic: ${MAIL_SENDER_FAILURE_TOPIC:notification.email-failed}
  failure-poll-ms: ${MAIL_SENDER_FAILURE_POLL_MS:5000}
