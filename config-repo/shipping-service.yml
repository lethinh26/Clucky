server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: shipping-service
  datasource:
    hikari:
      schema: shipping_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shipping_service
  flyway:
    default-schema: shipping_service
    schemas: shipping_service
    create-schemas: true
    baseline-on-migrate: false
