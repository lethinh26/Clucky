server:
  port: ${SERVER_PORT:8089}
spring:
  application:
    name: audit-service
  datasource:
    hikari:
      schema: audit_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit_service
  flyway:
    default-schema: audit_service
    schemas: audit_service
    create-schemas: true
    baseline-on-migrate: false
