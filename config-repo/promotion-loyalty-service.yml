server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: promotion-loyalty-service
  datasource:
    hikari:
      schema: promotion_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: promotion_service
  flyway:
    default-schema: promotion_service
    schemas: promotion_service
    create-schemas: true
    baseline-on-migrate: true

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:clucky}

clucky:
  loyalty:
    order-url: ${ORDER_SERVICE_URL:http://cart-order-service}
