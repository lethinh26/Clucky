server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: catalog-store-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_NAME:clucky}?currentSchema=catalog_service
  jpa:
    hikari:
      schema: catalog_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog_service
  flyway:
    default-schema: catalog_service
    schemas: catalog_service
    create-schemas: true
    baseline-on-migrate: false

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:clucky}
