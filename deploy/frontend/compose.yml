# Separate project: this file never starts or stops backend/infrastructure.
services:
  customer:
    image: clucky-customer:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin:
    image: clucky-admin:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:8080"
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
