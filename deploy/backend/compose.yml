x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-environment: &environment
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: prod
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka/
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-clucky}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_NAME: ${DB_NAME:-clucky}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-clucky-identity}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-clucky-api}
  API_DOCS_ENABLED: "false"

x-java: &java
  restart: unless-stopped
  init: true
  mem_limit: 640m
  security_opt:
    - no-new-privileges:true
  logging: *logging
  environment: *environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    config-server:
      condition: service_healthy
    discovery-server:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clucky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-clucky}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 12

  config-server:
    image: clucky-config-server:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      SERVER_PORT: "8888"
      CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  discovery-server:
    image: clucky-discovery-server:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      SERVER_PORT: "8761"
    depends_on:
      config-server:
        condition: service_healthy

  identity-service:
    <<: *java
    image: clucky-identity-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      FIREBASE_AUTH_ENABLED: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      AUTH_ALLOWED_ORIGINS: ${FRONTEND_CUSTOMER_URL},${FRONTEND_ADMIN_URL}
    volumes:
      - ${VPS_WORKDIR:?VPS_WORKDIR is required}/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  catalog-store-service:
    <<: *java
    image: clucky-catalog-store-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

  cart-order-service:
    <<: *java
    image: clucky-cart-order-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      CATALOG_SERVICE_URL: http://catalog-store-service
      SHIPPING_SERVICE_URL: http://shipping-service
      PROMOTION_SERVICE_URL: http://promotion-loyalty-service
      CATALOG_SERVICE_TOKEN: ${CATALOG_SERVICE_TOKEN:-}
      PROMOTION_SERVICE_TOKEN: ${PROMOTION_SERVICE_TOKEN:-}

  payment-service:
    <<: *java
    image: clucky-payment-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}

  promotion-loyalty-service:
    <<: *java
    image: clucky-promotion-loyalty-service:${IMAGE_TAG:?IMAGE_TAG is required}

  shipping-service:
    <<: *java
    image: clucky-shipping-service:${IMAGE_TAG:?IMAGE_TAG is required}

  notification-service:
    <<: *java
    image: clucky-notification-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      MAIL_SENDER_ENABLED: ${MAIL_SENDER_ENABLED:-false}
      MAIL_SENDER_USERNAME: ${MAIL_SENDER_USERNAME:-}
      MAIL_SENDER_APP_PASSWORD: ${MAIL_SENDER_APP_PASSWORD:-}

  review-report-service:
    <<: *java
    image: clucky-review-report-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      REPORT_REVENUE_EVENT: ${REPORT_REVENUE_EVENT:-false}

  audit-service:
    <<: *java
    image: clucky-audit-service:${IMAGE_TAG:?IMAGE_TAG is required}

  api-gateway:
    <<: *java
    image: clucky-api-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *environment
      FRONTEND_CUSTOMER_URL: ${FRONTEND_CUSTOMER_URL:?FRONTEND_CUSTOMER_URL is required}
      FRONTEND_ADMIN_URL: ${FRONTEND_ADMIN_URL:?FRONTEND_ADMIN_URL is required}
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-store-service:
        condition: service_healthy
      cart-order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      promotion-loyalty-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      review-report-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy

networks:
  default:
    name: clucky-app

volumes:
  postgres-data:
    name: clucky-backend-postgres-data
  redis-data:
    name: clucky-backend-redis-data
  kafka-data:
    name: clucky-backend-kafka-data
