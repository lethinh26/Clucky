spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server:
  port: ${SERVER_PORT:8087}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

mail-sender:
  enabled: ${MAIL_SENDER_ENABLED:false}
  host: ${MAIL_SENDER_HOST:smtp.gmail.com}
  port: ${MAIL_SENDER_PORT:587}
  username: ${MAIL_SENDER_USERNAME:}
  app-password: ${MAIL_SENDER_APP_PASSWORD:}
  from-name: ${MAIL_SENDER_FROM_NAME:Clucky}
  timeout-ms: ${MAIL_SENDER_TIMEOUT_MS:8000}
  max-retries: ${MAIL_SENDER_MAX_RETRIES:3}
