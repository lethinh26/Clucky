spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:file:../../config-repo,file:../config-repo,file:./config-repo}
server:
  port: ${SERVER_PORT:8888}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
