name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: ${{ matrix.app }} / lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [nextjs, react]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  ui:
    name: Playwright / customer and admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/nextjs/package-lock.json
            frontend/react/package-lock.json

      - name: Install customer dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: frontend/react

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      # The existing Playwright suite starts Next.js in production mode,
      # plus the admin Vite server and the Google/payment fixture server.
      - name: Build customer for UI tests
        run: npm run build

      - name: UI tests
        run: npm run test:ui

      - name: Upload Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/nextjs/playwright-report/
            frontend/nextjs/test-results/
          retention-days: 7
          if-no-files-found: ignore
