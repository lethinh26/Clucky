name: Clucky full-stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production deployment midway through a release switch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  frontend:
    name: ${{ matrix.app }} / lint, test, build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [nextjs, react]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated error catalog
        run: node ../../scripts/generate-errors.mjs --check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  ui:
    name: Playwright / customer and admin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/nextjs/package-lock.json
            frontend/react/package-lock.json

      - name: Install customer dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: frontend/react

      # The existing Playwright suite starts Next.js in production mode,
      # plus the admin production preview and the Google/payment fixture server.
      - name: Build customer for UI tests
        run: npm run build
        env:
          INTERNAL_API_URL: "http://127.0.0.1:4175"
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: "pk.playwright-test-token"

      - name: Build admin for UI tests
        run: npm run build
        working-directory: frontend/react

      - name: UI tests
        run: npm run test:ui
        env:
          API_URL: "http://127.0.0.1:4175"
          INTERNAL_API_URL: "http://127.0.0.1:4175"

      - name: Upload Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/nextjs/playwright-report/
            frontend/nextjs/test-results/
          retention-days: 7
          if-no-files-found: ignore

  preflight:
    name: Plan changed images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: frontend-production
    permissions:
      contents: read
      packages: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      release_id: ${{ steps.plan.outputs.release_id }}
    env:
      BACKEND_ENV_JSON: ${{ secrets.BACKEND_ENV_JSON }}
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      PUBLIC_API_URL: ${{ vars.FRONTEND_API_URL }}
      FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      CUSTOMER_DEMO_ENABLED: ${{ vars.NEXT_PUBLIC_M3_DEMO_ENABLED || 'false' }}
      IMAGE_CACHE_EPOCH: ${{ vars.IMAGE_CACHE_EPOCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse images with identical source and build arguments
        id: plan
        run: python3 deploy/images.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ env.RELEASE_ID }}
          path: release-plan.json
          retention-days: 30
          if-no-files-found: error

  images:
    name: Package image / ${{ matrix.build }}
    needs: preflight
    if: needs.preflight.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: frontend-production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        build: ${{ fromJSON(needs.preflight.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ needs.preflight.outputs.release_id }}
      - name: Select image from release plan
        id: image
        env:
          BUILD_INDEX: ${{ matrix.build }}
        run: python3 deploy/images.py select "$BUILD_INDEX"
      - uses: actions/setup-java@v4
        if: steps.image.outputs.context == 'backend'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.image.outputs.context == 'backend'
      - name: Build only the selected Java service
        if: steps.image.outputs.context == 'backend'
        env:
          SERVICE: ${{ steps.image.outputs.service }}
        run: |
          set -euo pipefail
          cd backend
          bash gradlew ":$SERVICE:bootJar" --no-daemon --max-workers=2 --build-cache
          mkdir -p ../image-context
          cp "$SERVICE/build/libs/$SERVICE-0.1.0-SNAPSHOT.jar" ../image-context/app.jar
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare public build arguments
        id: args
        env:
          SERVICE: ${{ steps.image.outputs.service }}
        run: python3 deploy/images.py args "$SERVICE"
      - name: Build cached image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context == 'backend' && 'image-context' || steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ steps.image.outputs.image }}
          build-args: ${{ steps.args.outputs.args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.image.outputs.service }}
          cache-to: type=gha,scope=${{ steps.image.outputs.service }},mode=max
      - name: Check frontend container health before publishing
        if: steps.image.outputs.context != 'backend'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          trap 'docker rm -f frontend-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name frontend-smoke "$IMAGE"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' frontend-smoke)
            if [[ "$status" == healthy ]]; then exit 0; fi
            if [[ "$status" == unhealthy ]]; then break; fi
            sleep 2
          done
          docker logs frontend-smoke
          exit 1
      - name: Publish immutable input image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

  deploy:
    name: Deploy infrastructure, backend and frontends to VPS
    needs: [preflight, images]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: frontend-production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: clucky-full-stack-production
      cancel-in-progress: false
    env:
      # Retain the packaged ID when only a failed deployment job is rerun.
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      DEPLOY_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '8686' }}
      DEPLOY_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_WORKDIR: ${{ vars.VPS_WORKDIR || secrets.VPS_WORKDIR || '/opt/clucky' }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject an obsolete main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'A newer main revision exists; skip this release.' >&2; exit 1; }

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.RELEASE_ID }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin every service to its registry digest
        run: python3 deploy/images.py bundle

      - name: Prepare SSH and release manifest
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Invalid or missing VPS_HOST' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid or missing VPS_USER' >&2; exit 1; }
          [[ "$VPS_WORKDIR" =~ ^/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]] || { echo 'VPS_WORKDIR must be an absolute path without spaces, dot segments or a trailing slash.' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535)) || { echo 'Invalid SSH port' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure VPS_SSH_KEY and verified VPS_SSH_KNOWN_HOSTS first.' >&2; exit 1; }
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/frontend_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/frontend_known_hosts"
          cp deploy/frontend/compose.yml deploy/frontend/deploy.sh bundle/
          printf 'IMAGE_TAG=%s\n' "$RELEASE_ID" > bundle/release.env
          (cd bundle && sha256sum images.json compose.yml deploy.sh release.env > SHA256SUMS)
          cp deploy/backend/compose.yml deploy/backend/deploy.sh deploy/backend/prepare.py backend-bundle/
          cp deploy/identity/firebase_secret.py backend-bundle/install-firebase.py
          mkdir -p backend-bundle/config-repo
          cp config-repo/*.yml backend-bundle/config-repo/
          (cd backend-bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Provision secrets and deploy complete stack
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BACKEND_ENV_JSON: ${{ secrets.BACKEND_ENV_JSON }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" && -n "$BACKEND_ENV_JSON" ]] || { echo 'Configure FIREBASE_SERVICE_ACCOUNT_JSON and BACKEND_ENV_JSON.' >&2; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          try:
              project = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])['project_id']
              if project != os.environ['EXPECTED_FIREBASE_PROJECT_ID']:
                  raise ValueError()
          except (ValueError, KeyError, TypeError):
              sys.exit('Firebase server credential and frontend project must match.')
          PY
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="$VPS_WORKDIR/frontend/incoming/$RELEASE_ID"
          backend_incoming="$VPS_WORKDIR/backend/incoming/$RELEASE_ID"
          registry_config="$VPS_WORKDIR/.registry-$RELEASE_ID"
          options=(-i "$RUNNER_TEMP/frontend_key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/frontend_known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "set -e; umask 077; mkdir -p '$incoming' '$backend_incoming'; command -v python3 >/dev/null; command -v flock >/dev/null; docker compose version >/dev/null"
          cleanup_registry() {
            ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "rm -f -- '$registry_config/config.json'; rmdir -- '$registry_config'" || true
          }
          trap cleanup_registry EXIT
          printf '%s' "$REGISTRY_TOKEN" | ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "umask 077; mkdir -p '$registry_config'; DOCKER_CONFIG='$registry_config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          SECONDS=0
          scp -r -P "$DEPLOY_PORT" "${options[@]}" backend-bundle/. "$target:$backend_incoming/"
          scp -P "$DEPLOY_PORT" "${options[@]}" \
            bundle/images.json bundle/compose.yml bundle/deploy.sh bundle/release.env bundle/SHA256SUMS "$target:$incoming/"
          printf 'Release manifest upload: %ss\n' "$SECONDS"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "python3 '$backend_incoming/install-firebase.py' '$VPS_WORKDIR'"
          printf '%s' "$BACKEND_ENV_JSON" | ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "VPS_HOST='$DEPLOY_HOST' python3 '$backend_incoming/prepare.py' '$VPS_WORKDIR' '$RELEASE_ID'"
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "DOCKER_CONFIG='$registry_config' VPS_WORKDIR='$VPS_WORKDIR' bash '$backend_incoming/deploy.sh' apply '$RELEASE_ID'"
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "DOCKER_CONFIG='$registry_config' VPS_WORKDIR='$VPS_WORKDIR' bash '$incoming/deploy.sh' apply '$RELEASE_ID'"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/frontend_key" "$RUNNER_TEMP/frontend_known_hosts"
