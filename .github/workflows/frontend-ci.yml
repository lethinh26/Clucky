name: Clucky full-stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production deployment midway through a release switch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  frontend:
    name: ${{ matrix.app }} / lint, test, build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [nextjs, react]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated error catalog
        run: node ../../scripts/generate-errors.mjs --check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  ui:
    name: Playwright / customer and admin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/nextjs/package-lock.json
            frontend/react/package-lock.json

      - name: Install customer dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: frontend/react

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      # The existing Playwright suite starts Next.js in production mode,
      # plus the admin production preview and the Google/payment fixture server.
      - name: Build customer for UI tests
        run: npm run build

      - name: Build admin for UI tests
        run: npm run build
        working-directory: frontend/react

      - name: UI tests
        run: npm run test:ui
        env:
          API_URL: "http://127.0.0.1:4175"
          INTERNAL_API_URL: "http://127.0.0.1:4175"

      - name: Upload Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/nextjs/playwright-report/
            frontend/nextjs/test-results/
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Package frontend images
    # PR checks gate merging; main packages the merged revision without retesting.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    env:
      PUBLIC_API_URL: ${{ vars.FRONTEND_API_URL }}
      FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      CUSTOMER_DEMO_ENABLED: ${{ vars.NEXT_PUBLIC_M3_DEMO_ENABLED || 'false' }}
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Identify release bundle
        id: release
        run: echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Require public Firebase configuration
        shell: bash
        run: |
          [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_AUTH_DOMAIN" && -n "$FIREBASE_PROJECT_ID" ]] || { echo 'Set the three NEXT_PUBLIC_FIREBASE_* repository Variables before deploying.' >&2; exit 1; }

      - name: Build production images on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          for app in nextjs react; do
            args=()
            if [[ "$app" == nextjs ]]; then
              image=customer
              args+=(--build-arg "NEXT_PUBLIC_API_URL=$PUBLIC_API_URL")
              args+=(--build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=$FIREBASE_API_KEY")
              args+=(--build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN")
              args+=(--build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
              args+=(--build-arg "NEXT_PUBLIC_M3_DEMO_ENABLED=$CUSTOMER_DEMO_ENABLED")
            else
              image=admin
              args+=(--build-arg "VITE_API_URL=$PUBLIC_API_URL")
            fi
            docker build --pull "${args[@]}" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "com.clucky.component=$image" \
              --tag "clucky-$image:$RELEASE_ID" "frontend/$app"
          done

      - name: Check production container health
        shell: bash
        run: |
          set -euo pipefail
          for image in customer admin; do
            container="frontend-smoke-$image"
            docker run --detach --name "$container" "clucky-$image:$RELEASE_ID"
            healthy=false
            for attempt in $(seq 1 45); do
              state=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              running=$(docker inspect --format '{{.State.Running}}' "$container")
              if [[ "$state" == healthy ]]; then healthy=true; break; fi
              if [[ "$state" == unhealthy || "$running" != true ]]; then break; fi
              sleep 3
            done
            if [[ "$healthy" != true ]]; then
              docker logs --tail 80 "$container"
              echo "Production container $image did not become healthy." >&2
              exit 1
            fi
          done

      - name: Remove smoke container
        if: always()
        run: docker rm -f frontend-smoke-customer frontend-smoke-admin || true

      - name: Export healthy image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          for image in customer admin; do
            docker save "clucky-$image:$RELEASE_ID" | gzip -1 > "bundle/$image.tar.gz"
          done

      - name: Store immutable release image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-images-${{ env.RELEASE_ID }}
          path: bundle/*.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  backend_images:
    name: Package all backend images
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_ID: ${{ needs.images.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build versioned Java images without running tests
        shell: bash
        run: |
          set -euo pipefail
          images=()
          for service in config-server discovery-server identity-service catalog-store-service cart-order-service payment-service promotion-loyalty-service shipping-service notification-service review-report-service audit-service api-gateway; do
            image="clucky-$service:$RELEASE_ID"
            docker build --build-arg "SERVICE_NAME=$service" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -f deploy/backend/Dockerfile --tag "$image" backend
            images+=("$image")
          done
          mkdir -p backend-bundle
          docker save "${images[@]}" | gzip -1 > backend-bundle/backend.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backend-images-${{ env.RELEASE_ID }}
          path: backend-bundle/backend.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy infrastructure, backend and frontends to VPS
    needs: [images, backend_images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: frontend-production
    concurrency:
      group: clucky-full-stack-production
      cancel-in-progress: false
    env:
      # Retain the packaged ID when only a failed deployment job is rerun.
      RELEASE_ID: ${{ needs.images.outputs.release_id }}
      DEPLOY_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '8686' }}
      DEPLOY_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_WORKDIR: ${{ vars.VPS_WORKDIR || secrets.VPS_WORKDIR || '/opt/clucky' }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject an obsolete main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'A newer main revision exists; skip this release.' >&2; exit 1; }

      - name: Download checked release images
        uses: actions/download-artifact@v4
        with:
          name: frontend-images-${{ env.RELEASE_ID }}
          path: bundle

      - name: Download backend images
        uses: actions/download-artifact@v4
        with:
          name: backend-images-${{ env.RELEASE_ID }}
          path: backend-bundle

      - name: Prepare SSH and release manifest
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Invalid or missing VPS_HOST' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid or missing VPS_USER' >&2; exit 1; }
          [[ "$VPS_WORKDIR" =~ ^/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]] || { echo 'VPS_WORKDIR must be an absolute path without spaces, dot segments or a trailing slash.' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535)) || { echo 'Invalid SSH port' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure VPS_SSH_KEY and verified VPS_SSH_KNOWN_HOSTS first.' >&2; exit 1; }
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/frontend_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/frontend_known_hosts"
          cp deploy/frontend/compose.yml deploy/frontend/deploy.sh bundle/
          printf 'IMAGE_TAG=%s\n' "$RELEASE_ID" > bundle/release.env
          (cd bundle && sha256sum customer.tar.gz admin.tar.gz compose.yml deploy.sh release.env > SHA256SUMS)
          cp deploy/backend/compose.yml deploy/backend/deploy.sh deploy/backend/prepare.py backend-bundle/
          cp deploy/identity/firebase_secret.py backend-bundle/install-firebase.py
          mkdir -p backend-bundle/config-repo
          cp config-repo/*.yml backend-bundle/config-repo/
          (cd backend-bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Provision secrets and deploy complete stack
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BACKEND_ENV_JSON: ${{ secrets.BACKEND_ENV_JSON }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" && -n "$BACKEND_ENV_JSON" ]] || { echo 'Configure FIREBASE_SERVICE_ACCOUNT_JSON and BACKEND_ENV_JSON.' >&2; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          try:
              project = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])['project_id']
              if project != os.environ['EXPECTED_FIREBASE_PROJECT_ID']:
                  raise ValueError()
          except (ValueError, KeyError, TypeError):
              sys.exit('Firebase server credential and frontend project must match.')
          PY
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="$VPS_WORKDIR/frontend/incoming/$RELEASE_ID"
          backend_incoming="$VPS_WORKDIR/backend/incoming/$RELEASE_ID"
          options=(-i "$RUNNER_TEMP/frontend_key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/frontend_known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "set -e; umask 077; mkdir -p '$incoming' '$backend_incoming'; command -v python3 >/dev/null; command -v flock >/dev/null; docker compose version >/dev/null"
          scp -r -P "$DEPLOY_PORT" "${options[@]}" backend-bundle/. "$target:$backend_incoming/"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "python3 '$backend_incoming/install-firebase.py' '$VPS_WORKDIR'"
          printf '%s' "$BACKEND_ENV_JSON" | ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "python3 '$backend_incoming/prepare.py' '$VPS_WORKDIR' '$RELEASE_ID'"
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "VPS_WORKDIR='$VPS_WORKDIR' bash '$backend_incoming/deploy.sh' apply '$RELEASE_ID'"
          scp -P "$DEPLOY_PORT" "${options[@]}" \
            bundle/customer.tar.gz bundle/admin.tar.gz bundle/compose.yml \
            bundle/deploy.sh bundle/release.env bundle/SHA256SUMS "$target:$incoming/"
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "VPS_WORKDIR='$VPS_WORKDIR' bash '$incoming/deploy.sh' apply '$RELEASE_ID'"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/frontend_key" "$RUNNER_TEMP/frontend_known_hosts"
