name: Provision Firebase credential on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clucky-full-stack-production
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: backend-production
    env:
      DEPLOY_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '8686' }}
      DEPLOY_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_WORKDIR: ${{ vars.VPS_WORKDIR || secrets.VPS_WORKDIR || '/opt/clucky' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare verified SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Invalid VPS_HOST' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid VPS_USER' >&2; exit 1; }
          [[ "$VPS_WORKDIR" =~ ^/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]] || { echo 'Invalid VPS_WORKDIR' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535)) || { echo 'Invalid VPS_PORT' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure VPS_SSH_KEY and verified VPS_SSH_KNOWN_HOSTS.' >&2; exit 1; }
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/firebase_ssh_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/firebase_known_hosts"

      - name: Install credential without logging its contents
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]] || { echo 'Configure FIREBASE_SERVICE_ACCOUNT_JSON.' >&2; exit 1; }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_script="$VPS_WORKDIR/.firebase-provision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.py"
          options=(-i "$RUNNER_TEMP/firebase_ssh_key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/firebase_known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "test -d '$VPS_WORKDIR' && command -v python3 >/dev/null"
          cleanup() { ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "rm -f -- '$remote_script'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          scp -P "$DEPLOY_PORT" "${options[@]}" deploy/identity/firebase_secret.py "$target:$remote_script"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" |
            ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "python3 '$remote_script' '$VPS_WORKDIR'"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/firebase_ssh_key" "$RUNNER_TEMP/firebase_known_hosts"
