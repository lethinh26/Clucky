services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clucky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: clucky
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
  kafka:
    image: bitnami/kafka:3.9
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka-data:/bitnami/kafka]
  config-server:
    build: ./backend/config-server
    environment: ["CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo"]
    volumes: [./config-repo:/config-repo:ro]
    ports: ["8888:8888"]
    depends_on: [postgres]
  discovery-server:
    build: ./backend/discovery-server
    environment: ["EUREKA_URL=http://discovery-server:8761/eureka/"]
    ports: ["8761:8761"]
    depends_on: [config-server]
  api-gateway:
    build: ./backend/api-gateway
    environment: ["CONFIG_SERVER_URL=http://config-server:8888", "EUREKA_URL=http://discovery-server:8761/eureka/"]
    ports: ["8080:8080"]
    depends_on: [discovery-server]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
