x-java-build: &java-build
  context: ./backend
  dockerfile: ../deploy/backend/Dockerfile

services:
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: clucky-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 12

  config-server:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: config-server
  discovery-server:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: discovery-server
  identity-service:
    environment:
      AUTH_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173
    build:
      <<: *java-build
      args:
        SERVICE_NAME: identity-service
  catalog-store-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: catalog-store-service
  cart-order-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: cart-order-service
  payment-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: payment-service
    environment:
      PAYMENT_LOCAL_SIMULATION_ENABLED: "true"
  promotion-loyalty-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: promotion-loyalty-service
  shipping-service:
    environment:
      SHIPPING_MOCK_ENABLED: "true"
    build:
      <<: *java-build
      args:
        SERVICE_NAME: shipping-service
  notification-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: notification-service
  review-report-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: review-report-service
  audit-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: audit-service
  api-gateway:
    environment:
      AUTH_CUSTOMER_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTH_ADMIN_ORIGINS: http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173
    build:
      <<: *java-build
      args:
        SERVICE_NAME: api-gateway
  customer:
    build:
      context: ./frontend/nextjs
      args:
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set Firebase web config in frontend/nextjs/.env}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set Firebase web config in frontend/nextjs/.env}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set Firebase web config in frontend/nextjs/.env}
        NEXT_PUBLIC_M3_DEMO_ENABLED: "false"
        NEXT_PUBLIC_PAYMENT_SIMULATION_ENABLED: "false"
    depends_on:
      api-gateway:
        condition: service_healthy
  admin:
    build:
      context: ./frontend/react
      args:
        VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
        VITE_API_URL: http://localhost:8080
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  default:
    name: clucky-local
    external: false

volumes:
  postgres-data:
    name: clucky-local-postgres-data
  redis-data:
    name: clucky-local-redis-data
  kafka-data:
    name: clucky-local-kafka-data
